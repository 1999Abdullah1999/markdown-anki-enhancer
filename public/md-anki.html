<style>
/* ============ CSS VARIABLES / THEMES ============ */
:root {
  --bg-primary: #0f0f1a;
  --bg-secondary: #161627;
  --bg-editor: #0d0d1a;
  --bg-preview: #1a1a2e;
  --text-primary: #e2e2f0;
  --text-secondary: #8888aa;
  --accent: #7c3aed;
  --accent-light: #a78bfa;
  --border: #2a2a45;
  --code-bg: #0d1117;
  --code-text: #e06c75;
  --hover-bg: rgba(124, 58, 237, 0.1);
  --toast-bg: #1e1e36;
  --section-hover: rgba(124, 58, 237, 0.15);
  --section-border: rgba(124, 58, 237, 0.5);
  --table-stripe: rgba(255,255,255,0.03);
  --table-header: rgba(124, 58, 237, 0.15);
  --blockquote-bg: rgba(124, 58, 237, 0.08);
}

body.light {
  --bg-primary: #f0f0f5;
  --bg-secondary: #ffffff;
  --bg-editor: #ffffff;
  --bg-preview: #ffffff;
  --text-primary: #1a1a2e;
  --text-secondary: #555577;
  --accent: #7c3aed;
  --accent-light: #6d28d9;
  --border: #d0d0e0;
  --code-bg: #f6f8fa;
  --code-text: #d63384;
  --hover-bg: rgba(124, 58, 237, 0.06);
  --toast-bg: #ffffff;
  --section-hover: rgba(124, 58, 237, 0.08);
  --section-border: rgba(124, 58, 237, 0.4);
  --table-stripe: rgba(0,0,0,0.02);
  --table-header: rgba(124, 58, 237, 0.1);
  --blockquote-bg: rgba(124, 58, 237, 0.05);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  margin: 0; padding: 0; height: 100%; height: 100dvh;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Tahoma', 'Noto Sans Arabic', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
}
body { display: flex; flex-direction: column; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

/* ============ HEADER ============ */
.header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 0 12px;
  height: 50px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  gap: 6px;
  z-index: 10;
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1rem; white-space: nowrap; }
.logo-icon { font-size: 1.3rem; }
.logo-text span { color: var(--accent); }
.header-spacer { flex: 1; }

/* View-mode segmented control */
.mode-switch {
  display: inline-flex;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}
.mode-btn {
  border: none; background: transparent;
  color: var(--text-secondary);
  padding: 5px 11px;
  font-size: 0.8rem; font-weight: 600;
  border-radius: 6px; cursor: pointer;
  transition: all 0.18s;
  display: inline-flex; align-items: center; gap: 5px;
}
.mode-btn:hover { color: var(--text-primary); }
.mode-btn.active { background: var(--accent); color: #fff; }

.header-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: transparent;
  color: var(--text-primary);
  font-size: 0.82rem; font-weight: 500;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.header-btn:hover { background: var(--hover-bg); border-color: var(--accent); }
.header-btn .btn-icon { font-size: 1rem; }

.btn-settings { border-color: transparent; }
.btn-clear { border-color: var(--border); }
.btn-clear:hover { border-color: #ef4444; color: #ef4444; }

.btn-copy {
  background: rgba(234, 179, 8, 0.1);
  border-color: rgba(234, 179, 8, 0.3);
  color: #eab308;
}
.btn-copy:hover { background: rgba(234, 179, 8, 0.2); border-color: #eab308; }

.btn-save {
  background: rgba(124, 58, 237, 0.15);
  border-color: rgba(124, 58, 237, 0.4);
  color: var(--accent-light);
}
.btn-save:hover { background: rgba(124, 58, 237, 0.3); border-color: var(--accent); }

@media (max-width: 767px) {
  .header { padding: 0 8px; height: 46px; gap: 4px; }
  .btn-label { display: none; }
  .header-btn { padding: 6px 8px; }
  .logo-text { font-size: 0.95rem; }
  .mode-btn { padding: 5px 8px; }
  .mode-btn .mode-label { display: none; }
}

/* ============ MAIN CONTAINER ============ */
.main-container {
  flex: 1;
  display: flex;
  flex-direction: row;
  min-height: 0;
  overflow: hidden;
}

/* Mode classes on body control layout */
body.mode-editor .preview-panel,
body.mode-editor .resizer { display: none; }
body.mode-editor .editor-panel { width: 100% !important; border-right: none; flex: 1; }

body.mode-preview .editor-panel,
body.mode-preview .resizer { display: none; }
body.mode-preview .preview-panel { width: 100% !important; flex: 1; }

/* split is default */
body.mode-split .editor-panel { border-right: 1px solid var(--border); }

/* ============ EDITOR PANEL ============ */
.editor-panel {
  width: 50%;
  display: flex; flex-direction: column;
  min-height: 0; overflow: hidden;
  border-right: 1px solid var(--border);
}
.panel-header {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 16px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text-secondary);
}
.char-count {
  background: var(--hover-bg); color: var(--accent-light);
  padding: 2px 8px; border-radius: 10px;
  font-size: 0.65rem; font-weight: 600;
}

#editor {
  flex: 1; min-height: 0; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  resize: none; border: none; outline: none;
  background: var(--bg-editor);
  color: var(--text-primary);
  font-family: 'JetBrains Mono', 'Fira Code', 'Noto Sans Arabic', Consolas, 'Courier New', monospace;
  font-size: 14px; line-height: 1.7;
  padding: 20px; tab-size: 4; width: 100%;
  unicode-bidi: plaintext;
}
#editor::placeholder { color: var(--text-secondary); }

/* ============ RESIZER ============ */
.resizer {
  flex-shrink: 0; width: 5px; cursor: col-resize;
  background: var(--border); transition: background 0.2s; z-index: 5;
}
.resizer:hover, .resizer.active { background: var(--accent); }
@media (max-width: 767px) {
  .resizer { display: none; }
  body.mode-split .editor-panel { width: 100% !important; border-right: none; }
  body.mode-split .preview-panel { display: none; }
}

/* ============ PREVIEW PANEL ============ */
.preview-panel {
  flex: 1; display: flex; flex-direction: column;
  min-height: 0; overflow: hidden;
}
.preview-scroll-container {
  flex: 1; min-height: 0; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--bg-preview);
  padding: 24px;
}

/* ============ MARKDOWN RENDERED STYLES ============ */
.md-body { color: var(--text-primary); font-size: 15px; line-height: 1.8; word-wrap: break-word; unicode-bidi: plaintext; }

.md-body h1 { font-size: 2em; font-weight: 800; border-bottom: 3px solid var(--accent); padding-bottom: 0.4em; margin-top: 1em; margin-bottom: 0.6em; }
.md-body h1:first-child { margin-top: 0; }
.md-body h2 { font-size: 1.5em; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; margin-top: 1.2em; margin-bottom: 0.5em; }
.md-body h3 { font-size: 1.3em; font-weight: 700; margin-top: 1em; margin-bottom: 0.4em; }
.md-body h4 { font-size: 1.1em; font-weight: 600; margin-top: 0.8em; margin-bottom: 0.3em; }
.md-body h5 { font-size: 1em; font-weight: 600; margin-top: 0.6em; margin-bottom: 0.3em; }
.md-body h6 { font-size: 0.9em; font-weight: 600; color: var(--text-secondary); margin-top: 0.6em; margin-bottom: 0.3em; }

.md-body p { margin: 0.7em 0; line-height: 1.8; unicode-bidi: plaintext; }
.md-body strong { font-weight: 700; }
.md-body em { font-style: italic; }
.md-body a { color: var(--accent-light); text-decoration: underline dotted; text-underline-offset: 3px; }
.md-body a:hover { color: var(--accent); text-decoration: underline solid; }

.md-body code {
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 7px;
  font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
  font-size: 0.88em; color: var(--code-text);
  direction: ltr; unicode-bidi: embed;
}
.md-body pre {
  background: var(--code-bg) !important;
  border: 1px solid var(--border);
  border-radius: 8px; padding: 18px;
  overflow-x: auto; margin: 1em 0;
  direction: ltr; unicode-bidi: embed;
}
.md-body pre code { background: transparent !important; border: none; padding: 0; font-size: 13px; color: inherit; line-height: 1.6; }

.md-body blockquote {
  border-inline-start: 4px solid var(--accent);
  background: var(--blockquote-bg);
  padding: 12px 20px; margin: 1em 0;
  border-radius: 0 8px 8px 0;
  unicode-bidi: plaintext;
}
.md-body blockquote[dir="rtl"] { border-radius: 8px 0 0 8px; }
.md-body blockquote p { margin: 0.3em 0; }

.md-body ul, .md-body ol {
  padding-inline-start: 1.8em;
  margin: 0.6em 0; line-height: 1.7;
  unicode-bidi: plaintext;
}
.md-body li { margin: 0.25em 0; }
.md-body li > ul, .md-body li > ol { margin: 0.15em 0; }

.md-body ul.contains-task-list { list-style: none; padding-inline-start: 0.5em; }
.md-body input[type="checkbox"] { accent-color: var(--accent); margin-inline-end: 6px; vertical-align: middle; }

.md-body table {
  width: 100%; border-collapse: collapse;
  margin: 1em 0; font-size: 0.92em;
}
.md-body table th, .md-body table td {
  border: 1px solid var(--border);
  padding: 10px 14px;
  text-align: start;
}
.md-body table th { background: var(--table-header); font-weight: 700; }
.md-body table tr:nth-child(even) { background: var(--table-stripe); }
.md-body table[dir="rtl"] th, .md-body table[dir="rtl"] td { text-align: right; }

.md-body hr { border: none; height: 2px; background: var(--border); margin: 2em 0; }
.md-body img { max-width: 100%; border-radius: 8px; margin: 0.5em 0; }

/* ============ SECTION WRAPPERS ============ */
.section-wrapper {
  position: relative;
  border: 2px dashed transparent;
  border-radius: 8px;
  padding: 4px; margin: 4px -4px;
  transition: border-color 0.2s, background 0.2s;
  unicode-bidi: plaintext;
}
.section-wrapper:hover {
  border-color: var(--section-border);
  background: var(--section-hover);
}
.section-actions {
  position: absolute;
  top: 6px;
  inset-inline-end: 6px;
  display: none;
  gap: 4px;
  z-index: 5;
}
.section-wrapper:hover .section-actions { display: inline-flex; }

.section-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 9px;
  border: none; border-radius: 6px;
  font-size: 0.72rem; font-weight: 600;
  cursor: pointer; opacity: 0.92;
  transition: opacity 0.2s, transform 0.1s;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.section-btn:hover { opacity: 1; }
.section-btn:active { transform: scale(0.96); }
.section-btn.section-copy { background: #eab308; color: #1a1a2e; }
.section-btn.section-save { background: var(--accent); }

/* ============ SETTINGS MODAL ============ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; opacity: 0; visibility: hidden;
  transition: all 0.25s;
}
.modal-overlay.open { opacity: 1; visibility: visible; }
.modal-panel {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 28px;
  width: 92%; max-width: 440px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  transform: translateY(20px);
  transition: transform 0.25s;
}
.modal-overlay.open .modal-panel { transform: translateY(0); }
.modal-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
.setting-row { margin-bottom: 18px; }
.setting-label { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
.setting-value { background: var(--hover-bg); color: var(--accent-light); padding: 2px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; font-family: monospace; }

input[type="range"] { width: 100%; height: 6px; -webkit-appearance: none; appearance: none; background: var(--border); border-radius: 3px; outline: none; cursor: pointer; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-secondary); cursor: pointer; }
input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-secondary); cursor: pointer; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; }
.toggle-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

.modal-done-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 8px; }
.modal-done-btn:hover { opacity: 0.9; }

/* ============ TOAST ============ */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  opacity: 0;
  background: var(--toast-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 22px;
  font-size: 0.85rem; font-weight: 600;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  z-index: 200; transition: all 0.35s ease;
  white-space: nowrap; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success { border-left: 4px solid #22c55e; }
.toast.error { border-left: 4px solid #ef4444; }
.toast.neutral { border-left: 4px solid var(--accent); }
</style>
</head>
<body class="mode-split">

<!-- ============ HEADER ============ -->
<div class="header">
  <div class="logo">
    <span class="logo-icon">📝</span>
    <span class="logo-text">MD <span>→</span> Anki</span>
  </div>
  <div class="header-spacer"></div>

  <div class="mode-switch" role="tablist" aria-label="View mode">
    <button class="mode-btn" data-mode="editor" onclick="setMode('editor')" title="Editor only">
      <span>✏️</span><span class="mode-label">Editor</span>

  <button class="header-btn btn-settings" onclick="toggleSettings()" title="Settings">

    <span class="btn-icon" id="themeIcon">🌙</span><span class="btn-label" id="themeLabel">Dark</span>

<div class="main-container">

      <span class="char-count" id="charCount">0 chars</span>

<div class="modal-overlay" id="settingsModal" onclick="closeSettingsOutside(event)">

<script>
// ============ CONFIG ============
const CONFIG = {
  scale: 2,
  maxWidth: 800,
  fontSize: 15,
  padding: 28,
  syncScroll: true,
  smartArrows: true,
};

const DEFAULT_MD = `# 📝 MD → Anki: Markdown Preview & Exporter

Welcome! Paste content from **ChatGPT**, **Claude**, **Gemini**, or any AI chatbot — or write your own Markdown. Arabic is fully supported.

---

## ✨ Features

- **Live preview** as you type
- **Export to PNG** for Anki flashcards
- 📋 Copy or 📸 Save per section (hover any section)
- 🔁 Synchronized scroll between editor & preview
- 🌐 Arabic + RTL auto-detection
- ➡️ Smart arrows: -> becomes →, => becomes ⇒
- 3 view modes: Editor / Split / Preview

## 🌐 العربية

مرحباً! هذا المحرر يدعم اللغة العربية تلقائياً. اتجاه النص يتغيّر حسب المحتوى.

- عنصر أول
- عنصر ثاني -> مع سهم
- عنصر ثالث => مع سهم مزدوج

> اقتباس باللغة العربية لاختبار الاتجاه التلقائي.

## 📐 Code

\`\`\`python
def fibonacci(n):
    a, b = 0, 1
    for _ in range(n):
        yield a
        a, b = b, a + b
\`\`\`

## 📊 Table

| Feature | Status |
|---------|--------|
| Live Preview | ✅ |
| PNG Export | ✅ |
| Section Copy | ✅ |
| Arabic | ✅ |

---

*Hover any section to see 📋 Copy and 📸 Save buttons.*
`;

// ============ MARKED CONFIG ============
marked.setOptions({
  breaks: true,
  gfm: true,
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
    }
    try { return hljs.highlightAuto(code).value; } catch(e) {}
    return code;
  }
});

// ============ ELEMENTS ============
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const previewScroll = document.getElementById('previewScroll');
const charCount = document.getElementById('charCount');
const toast = document.getElementById('toast');
const settingsModal = document.getElementById('settingsModal');
const resizer = document.getElementById('resizer');
const editorPanel = document.getElementById('editorPanel');
const previewPanel = document.getElementById('previewPanel');

// ============ ARROW SUBSTITUTION ============
// Applied to text nodes only (skips code/pre/a) AFTER markdown rendering.
const ARROW_RULES = [
  [/<==>/g, '⇔'],
  [/<=>/g,  '⇔'],
  [/<->/g,  '↔'],
  [/==>/g,  '⇒'],
  [/=>/g,   '⇒'],
  [/<==/g,  '⇐'],
  [/<=/g,   '⇐'],
  [/-->/g,  '→'],
  [/->/g,   '→'],
  [/<--/g,  '←'],
  [/<-/g,   '←'],
];
function replaceArrowsInTextNodes(root) {
  if (!CONFIG.smartArrows) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      let p = node.parentNode;
      while (p && p !== root) {
        const tag = p.tagName;
        if (tag === 'CODE' || tag === 'PRE' || tag === 'A' || tag === 'SCRIPT' || tag === 'STYLE') {
          return NodeFilter.FILTER_REJECT;
        }
        p = p.parentNode;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(node => {
    let v = node.nodeValue;
    let out = v;
    for (const [re, ch] of ARROW_RULES) out = out.replace(re, ch);
    if (out !== v) node.nodeValue = out;
  });
}

// ============ RENDER ============
let renderTimeout;
function debouncedRender() {
  clearTimeout(renderTimeout);
  renderTimeout = setTimeout(renderMarkdown, 90);
}
function renderMarkdown() {
  const md = editor.value;
  charCount.textContent = md.length + ' chars';
  preview.innerHTML = marked.parse(md);
  preview.querySelectorAll('pre code').forEach(block => {
    if (!block.classList.contains('hljs')) hljs.highlightElement(block);
  });
  applyDirAuto(preview);
  replaceArrowsInTextNodes(preview);
  wrapSections();
  saveToStorage();
}

// Add dir="auto" to common block elements so RTL/LTR is per-element.
function applyDirAuto(root) {
  const sel = 'p,li,blockquote,h1,h2,h3,h4,h5,h6,td,th,table';
  root.querySelectorAll(sel).forEach(el => {
    if (!el.hasAttribute('dir')) el.setAttribute('dir', 'auto');
  });
}

// ============ SECTION WRAPPING ============
function wrapSections() {
  const children = Array.from(preview.children);
  if (children.length === 0) return;

  const hasHeadings = children.some(c => /^H[1-3]$/.test(c.tagName));
  if (!hasHeadings) return;

  const groups = [];
  let currentGroup = [];
  children.forEach(child => {
    const tag = child.tagName;
    if ((tag === 'H1' || tag === 'H2' || tag === 'H3') && currentGroup.length > 0) {
      groups.push(currentGroup); currentGroup = [];
    }
    currentGroup.push(child);
  });
  if (currentGroup.length > 0) groups.push(currentGroup);

  preview.innerHTML = '';
  groups.forEach(group => {
    const wrapper = document.createElement('div');
    wrapper.className = 'section-wrapper';
    wrapper.setAttribute('dir', 'auto');
    group.forEach(el => wrapper.appendChild(el));

    const actions = document.createElement('div');
    actions.className = 'section-actions';
    actions.setAttribute('dir', 'ltr');

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'section-btn section-copy';
    copyBtn.innerHTML = '📋 Copy';
    copyBtn.title = 'Copy section image to clipboard';
    copyBtn.onclick = (e) => { e.stopPropagation(); copySection(wrapper); };

    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'section-btn section-save';
    saveBtn.innerHTML = '📸 Save';
    saveBtn.title = 'Download section as PNG';
    saveBtn.onclick = (e) => { e.stopPropagation(); saveSection(wrapper); };

    actions.appendChild(copyBtn);
    actions.appendChild(saveBtn);
    wrapper.appendChild(actions);
    preview.appendChild(wrapper);
  });
}

// ============ IMAGE CAPTURE ============
async function captureElement(el) {
  const actions = el.querySelectorAll('.section-actions');
  actions.forEach(a => a.style.display = 'none');

  const orig = {
    width: el.style.width, maxWidth: el.style.maxWidth,
    fontSize: el.style.fontSize, padding: el.style.padding,
    border: el.style.border, borderRadius: el.style.borderRadius,
    background: el.style.background, margin: el.style.margin,
  };
  el.style.width = CONFIG.maxWidth + 'px';
  el.style.maxWidth = CONFIG.maxWidth + 'px';
  el.style.fontSize = CONFIG.fontSize + 'px';
  el.style.padding = CONFIG.padding + 'px';
  el.style.border = 'none';
  el.style.borderRadius = '0';
  el.style.margin = '0';
  const bgColor = getComputedStyle(previewScroll).backgroundColor;
  el.style.background = bgColor;

  await new Promise(r => setTimeout(r, 120));
  try {
    const canvas = await html2canvas(el, {
      scale: CONFIG.scale, backgroundColor: bgColor,
      useCORS: true, logging: false
    });
    Object.keys(orig).forEach(k => el.style[k] = orig[k]);
    actions.forEach(a => a.style.display = '');
    return canvas;
  } catch(err) {
    Object.keys(orig).forEach(k => el.style[k] = orig[k]);
    actions.forEach(a => a.style.display = '');
    showToast('Error capturing image: ' + err.message, 'error');
    return null;
  }
}

async function capturePreview() {
  const allActions = preview.querySelectorAll('.section-actions');
  allActions.forEach(a => a.style.display = 'none');

  const orig = {
    width: preview.style.width, maxWidth: preview.style.maxWidth,
    fontSize: preview.style.fontSize, padding: preview.style.padding,
  };
  preview.style.width = CONFIG.maxWidth + 'px';
  preview.style.maxWidth = CONFIG.maxWidth + 'px';
  preview.style.fontSize = CONFIG.fontSize + 'px';
  preview.style.padding = CONFIG.padding + 'px';

  const wrappers = preview.querySelectorAll('.section-wrapper');
  wrappers.forEach(w => {
    w.dataset.origBorder = w.style.border;
    w.dataset.origMargin = w.style.margin;
    w.dataset.origPadding = w.style.padding;
    w.style.border = 'none';
    w.style.margin = '0';
    w.style.padding = '0';
  });

  const bgColor = getComputedStyle(previewScroll).backgroundColor;
  await new Promise(r => setTimeout(r, 120));
  try {
    const canvas = await html2canvas(preview, {
      scale: CONFIG.scale, backgroundColor: bgColor,
      useCORS: true, logging: false
    });
    Object.keys(orig).forEach(k => preview.style[k] = orig[k]);
    allActions.forEach(a => a.style.display = '');
    wrappers.forEach(w => {
      w.style.border = w.dataset.origBorder || '';
      w.style.margin = w.dataset.origMargin || '';
      w.style.padding = w.dataset.origPadding || '';
    });
    return canvas;
  } catch(err) {
    Object.keys(orig).forEach(k => preview.style[k] = orig[k]);
    allActions.forEach(a => a.style.display = '');
    wrappers.forEach(w => {
      w.style.border = w.dataset.origBorder || '';
      w.style.margin = w.dataset.origMargin || '';
      w.style.padding = w.dataset.origPadding || '';
    });
    showToast('Error capturing image: ' + err.message, 'error');
    return null;
  }
}

async function downloadCanvas(canvas, name) {
  const link = document.createElement('a');
  link.download = (name || 'anki-card') + '-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
async function copyCanvasToClipboard(canvas) {
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  if (!navigator.clipboard || !window.ClipboardItem) throw new Error('Clipboard API unavailable');
  await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
}

async function saveImage() {
  showToast('Capturing image...', 'neutral');
  const canvas = await capturePreview();
  if (!canvas) return;
  await downloadCanvas(canvas, 'anki-card');
  showToast('✅ Image saved!', 'success');
}
async function copyImage() {
  showToast('Capturing image...', 'neutral');
  const canvas = await capturePreview();
  if (!canvas) return;
  try { await copyCanvasToClipboard(canvas); showToast('✅ Copied to clipboard!', 'success'); }
  catch(err) { await downloadCanvas(canvas, 'anki-card'); showToast('📥 Clipboard unavailable — downloaded instead', 'neutral'); }
}
async function saveSection(el) {
  showToast('Capturing section...', 'neutral');
  const canvas = await captureElement(el);
  if (!canvas) return;
  await downloadCanvas(canvas, 'anki-section');
  showToast('✅ Section saved!', 'success');
}
async function copySection(el) {
  showToast('Capturing section...', 'neutral');
  const canvas = await captureElement(el);
  if (!canvas) return;
  try { await copyCanvasToClipboard(canvas); showToast('✅ Section copied!', 'success'); }
  catch(err) { await downloadCanvas(canvas, 'anki-section'); showToast('📥 Clipboard unavailable — downloaded', 'neutral'); }
}

// ============ THEME ============
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  const themeLink = document.getElementById('hljs-theme');
  if (isLight) {
    themeLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
    document.getElementById('themeIcon').textContent = '☀️';
    document.getElementById('themeLabel').textContent = 'Light';
  } else {
    themeLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';
    document.getElementById('themeIcon').textContent = '🌙';
    document.getElementById('themeLabel').textContent = 'Dark';
  }
  try { localStorage.setItem('md-anki-dark', isLight ? '0' : '1'); } catch(e) {}
}

// ============ CLEAR ============
function clearEditor() {
  if (editor.value.length === 0) { setMode('editor'); editor.focus(); return; }
  if (confirm('Clear all editor content?')) {
    editor.value = '';
    renderMarkdown();
    setMode('editor');
    editor.focus();
  }
}

// ============ VIEW MODES ============
function setMode(mode) {
  if (!['editor','split','preview'].includes(mode)) mode = 'split';
  document.body.classList.remove('mode-editor','mode-split','mode-preview');
  document.body.classList.add('mode-' + mode);
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  try { localStorage.setItem('md-anki-mode', mode); } catch(e) {}
  if (mode === 'editor') {
    setTimeout(() => editor.focus(), 50);
  }
}

// ============ SETTINGS ============
function toggleSettings() { settingsModal.classList.toggle('open'); }
function closeSettingsOutside(e) { if (e.target === settingsModal) settingsModal.classList.remove('open'); }
function updateSetting(type) {
  if (type === 'scale') {
    CONFIG.scale = parseFloat(document.getElementById('scaleSlider').value);
    document.getElementById('scaleValue').textContent = CONFIG.scale + 'x';
  } else if (type === 'width') {
    CONFIG.maxWidth = parseInt(document.getElementById('widthSlider').value);
    document.getElementById('widthValue').textContent = CONFIG.maxWidth + 'px';
  } else if (type === 'fontSize') {
    CONFIG.fontSize = parseInt(document.getElementById('fontSizeSlider').value);
    document.getElementById('fontSizeValue').textContent = CONFIG.fontSize + 'px';
  } else if (type === 'padding') {
    CONFIG.padding = parseInt(document.getElementById('paddingSlider').value);
    document.getElementById('paddingValue').textContent = CONFIG.padding + 'px';
  }
}
document.addEventListener('DOMContentLoaded', () => {
  const syncEl = document.getElementById('syncScrollToggle');
  const arrEl = document.getElementById('arrowToggle');
  if (syncEl) syncEl.addEventListener('change', () => { CONFIG.syncScroll = syncEl.checked; try{localStorage.setItem('md-anki-sync', syncEl.checked?'1':'0');}catch(e){} });
  if (arrEl) arrEl.addEventListener('change', () => { CONFIG.smartArrows = arrEl.checked; try{localStorage.setItem('md-anki-arrows', arrEl.checked?'1':'0');}catch(e){} renderMarkdown(); });
});

// ============ TOAST ============
let toastTimer;
function showToast(msg, type = 'neutral') {
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.className = 'toast ' + type;
  requestAnimationFrame(() => { toast.classList.add('show'); });
  toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2500);
}

// ============ RESIZER ============
let isResizing = false;
resizer.addEventListener('mousedown', (e) => {
  isResizing = true; resizer.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none'; e.preventDefault();
});
document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const container = document.querySelector('.main-container');
  const rect = container.getBoundingClientRect();
  let pct = ((e.clientX - rect.left) / rect.width) * 100;
  pct = Math.max(15, Math.min(85, pct));
  editorPanel.style.width = pct + '%';
  previewPanel.style.flex = '1';
});
document.addEventListener('mouseup', () => {
  if (isResizing) {
    isResizing = false; resizer.classList.remove('active');
    document.body.style.cursor = ''; document.body.style.userSelect = '';
  }
});
resizer.addEventListener('touchstart', (e) => {
  isResizing = true; resizer.classList.add('active'); e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', (e) => {
  if (!isResizing) return;
  const touch = e.touches[0];
  const container = document.querySelector('.main-container');
  const rect = container.getBoundingClientRect();
  let pct = ((touch.clientX - rect.left) / rect.width) * 100;
  pct = Math.max(15, Math.min(85, pct));
  editorPanel.style.width = pct + '%';
}, { passive: false });
document.addEventListener('touchend', () => {
  if (isResizing) { isResizing = false; resizer.classList.remove('active'); }
});

// ============ SYNC SCROLL ============
// Ratio-based, with a lock flag to prevent feedback loops.
let syncLock = 0; // 0 = free, 1 = editor driving, 2 = preview driving
let syncUnlockTimer = null;
function scheduleSyncUnlock() {
  clearTimeout(syncUnlockTimer);
  syncUnlockTimer = setTimeout(() => { syncLock = 0; }, 80);
}
function ratio(el) {
  const max = el.scrollHeight - el.clientHeight;
  if (max <= 0) return 0;
  return el.scrollTop / max;
}
function applyRatio(el, r) {
  const max = el.scrollHeight - el.clientHeight;
  if (max <= 0) return;
  el.scrollTop = Math.max(0, Math.min(max, r * max));
}
editor.addEventListener('scroll', () => {
  if (!CONFIG.syncScroll) return;
  if (syncLock === 2) return;
  syncLock = 1;
  applyRatio(previewScroll, ratio(editor));
  scheduleSyncUnlock();
});
previewScroll.addEventListener('scroll', () => {
  if (!CONFIG.syncScroll) return;
  if (syncLock === 1) return;
  syncLock = 2;
  applyRatio(editor, ratio(previewScroll));
  scheduleSyncUnlock();
});

// ============ KEYBOARD SHORTCUTS ============
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 4;
    debouncedRender();
  }
});
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveImage(); }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.key === 'C')) { e.preventDefault(); copyImage(); }
});

// ============ PASTE → AUTO PREVIEW ============
editor.addEventListener('paste', (e) => {
  // Wait one tick so the pasted content reaches the textarea, then render and switch.
  setTimeout(() => {
    renderMarkdown();
    if (editor.value.trim().length > 0) setMode('preview');
  }, 0);
});

// ============ EMPTY EDITOR → AUTO OPEN EDITOR ============
let wasEmpty = false;
editor.addEventListener('input', () => {
  const empty = editor.value.length === 0;
  if (empty && !wasEmpty) {
    setMode('editor');
    setTimeout(() => editor.focus(), 50);
  }
  wasEmpty = empty;
});

// ============ LOCAL STORAGE ============
function saveToStorage() {
  try { localStorage.setItem('md-anki-content', editor.value); } catch(e) {}
}
function loadFromStorage() {
  try {
    const saved = localStorage.getItem('md-anki-content');
    editor.value = (saved !== null && saved !== '') ? saved : DEFAULT_MD;
  } catch(e) { editor.value = DEFAULT_MD; }
  wasEmpty = editor.value.length === 0;

  try {
    const darkPref = localStorage.getItem('md-anki-dark');
    if (darkPref === '0') {
      document.body.classList.add('light');
      document.getElementById('hljs-theme').href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
      document.getElementById('themeIcon').textContent = '☀️';
      document.getElementById('themeLabel').textContent = 'Light';
    }
    const mode = localStorage.getItem('md-anki-mode');
    if (mode) setMode(mode);
    const sync = localStorage.getItem('md-anki-sync');
    if (sync !== null) {
      CONFIG.syncScroll = sync === '1';
      const el = document.getElementById('syncScrollToggle');
      if (el) el.checked = CONFIG.syncScroll;
    }
    const arr = localStorage.getItem('md-anki-arrows');
    if (arr !== null) {
      CONFIG.smartArrows = arr === '1';
      const el = document.getElementById('arrowToggle');
      if (el) el.checked = CONFIG.smartArrows;
    }
  } catch(e) {}
}

// ============ INIT ============
editor.addEventListener('input', debouncedRender);
loadFromStorage();
renderMarkdown();
</script>
